name: verify

# 托管 runner 上的最小严谨闭环：typecheck + 全量单测 + 构建。
# 注意：当前仅手动触发——账号账单锁定期间托管 runner 无法启动，日常严谨提交门
# 是本地闭环 `pnpm run ci:local`（scripts/local-ci.sh，同一门禁语义）。账号解锁后
# 把 on 恢复为 push/pull_request 即可。
on:
  workflow_dispatch:
# 解锁后恢复：
# on:
#   push:
#     branches: [main]
#   pull_request:
#   workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # CI runs must never report to the production telemetry endpoint baked
  # into apps/cli/cordis.yml (AppCLIEntry disables the row when set).
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  verify:
    name: node ${{ matrix.node }} / typecheck + test + build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        node: ['22.19', '24']
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install (immutable)
        run: pnpm install --frozen-lockfile

      - name: Typecheck (repo-wide)
        run: pnpm run typecheck

      - name: Unit tests (full)
        run: pnpm run test

      - name: Build (lib + web)
        run: pnpm run build
