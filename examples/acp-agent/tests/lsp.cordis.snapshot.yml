# Keyless replay keeps the LSP composition intact and replaces only the model adapter.
- id: base
  name: '@huiliyi37/cordis-plugin-include'
  config:
    path: ../cordis.yml
    patches:
      - id: llm-deepseek
        name: '@huiliyi37/dsh-llm-deepseek'
        disabled: true
      - insert:
          - id: lsp
            name: '@huiliyi37/dsh-lsp'
          - id: lsp-local
            name: '@huiliyi37/dsh-lsp-local'
            config:
              servers:
                fixture:
                  command: !!js process.execPath
                  args: ['./lsp-server.mjs']
                  extensionToLanguage:
                    '.ts': typescript
          - id: timeout-guard
            name: '@huiliyi37/dsh-timeout-guard'
          - id: tool-lsp
            name: '@huiliyi37/dsh-tool-lsp'
            config:
              maxLocations: 1
          - id: llm-replay
            name: '@huiliyi37/dsh-llm-replay'
