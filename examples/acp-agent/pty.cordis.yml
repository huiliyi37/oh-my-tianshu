# Opt-in persistent PTY composition for the PTY snapshot scenario. The base
# deployment already owns the shared sandbox provider and policy.
- id: base
  name: '@huiliyi37/cordis-plugin-include'
  config:
    path: ./cordis.yml
    patches:
      - insert:
          - id: pty
            name: '@huiliyi37/dsh-pty'
          - id: pty-local
            name: '@huiliyi37/dsh-pty-local'
            config:
              pollIntervalMs: 10
              exactProbeAfterMs: 20
              idleSilenceMs: 250
              handoffGraceMs: 250
              timeoutMs: 2000
              disposeGraceMs: 500
          - id: tool-pty
            name: '@huiliyi37/dsh-tool-pty'
