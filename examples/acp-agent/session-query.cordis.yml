# Explicit session-query tool opt-in for the dedicated spill scenario. The
# nested filesystem overlay supplies private spill storage and its byte limit.
- id: base
  name: '@huiliyi37/cordis-plugin-include'
  config:
    path: ./fs.cordis.yml
    patches:
      - insert:
          - id: tool-session-query
            name: '@huiliyi37/dsh-tool-session-query'
          - id: timeout-guard
            name: '@huiliyi37/dsh-timeout-guard'
