# examples/tui — the interactive terminal UI composition.
#
# This leaf rides the @huiliyi37/dsh-tui bundle over the same agent spine
# the headless-agent example uses: settings + credentials + the real
# DeepSeek adapter + one pre-created `main` agent, then mounts the
# `tui-runner` plugin that drives the terminal render core. Run it with the
# repo root `.env` (DEEPSEEK_API_KEY) exported, or a gitignored root `.env`.

# User-settings document (`$DSH_HOME/settings.yaml`, hot-reloaded).
- id: settings
  name: '@huiliyi37/dsh-settings-local'

# Credential store: resolves DEEPSEEK_API_KEY from the process environment
# at each request — no key is inlined in this file.
- id: credentials
  name: '@huiliyi37/dsh-credentials-local'

# The DeepSeek adapter. Shipped default: full thinking at max effort.
- id: llm-deepseek
  name: '@huiliyi37/dsh-llm-deepseek'
  config:
    thinking: enabled
    reasoningEffort: max
    models:
      - id: deepseek-v4-pro
        contextWindow: 128000
      - id: deepseek-v4-flash
        contextWindow: 128000

# The example composition pre-creates one fresh `main` agent; the TUI runner
# switches into it on attach.
- id: agent-spine
  name: '@huiliyi37/dsh-agent-spine-demo'
  config:
    agents:
      - id: main
        provider: deepseek-official
        model: deepseek-v4-flash
        cwd: !!js process.cwd()
    workspaceContext:
      maxBytes: 65536
    persona: |
      You are the tui example agent, powered by the {{model}} model.

      Keep answers brief and factual.

# The interactive terminal UI runner: reads the session log through the
# read-only adapter/transcript projection and renders it with the ported
# render core. No new event vocabulary — the session log stays authoritative.
- id: tui-runner
  name: '@huiliyi37/dsh-tui'

# C3 项 3：文件快照（rewind 文件回退的底层）——写工具执行前全文件备份，
# /rewind 的 code/both 粒度依赖它。backupDir 默认 $TMPDIR/dsh-fs-snapshot。
- id: fs-snapshot
  name: '@huiliyi37/dsh-fs-snapshot'
