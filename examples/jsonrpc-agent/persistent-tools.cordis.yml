# Minimal unattended composition for the persistent Bash and string-replace
# editor. It is runnable through the JSON-RPC example runtime and intentionally
# keeps the model-facing surface to exactly these two tools.

- id: jsonrpc
  name: '@huiliyi37/dsh-jsonrpc'

- id: llm-deepseek
  name: '@huiliyi37/dsh-llm-deepseek'
  config:

- id: sandbox
  name: '@huiliyi37/dsh-sandbox-local'

- id: sandbox-policy
  name: '@huiliyi37/dsh-sandbox-policy'
  config:
    mode: danger-full-access
    workspaceRoot: !!js process.env.DSH_CWD ?? process.cwd()

- id: subprocess
  name: '@huiliyi37/dsh-subprocess-local'

- id: pty
  name: '@huiliyi37/dsh-pty'

- id: pty-local
  name: '@huiliyi37/dsh-pty-local'

- id: fs-sandbox
  name: '@huiliyi37/dsh-fs-sandbox'
  config:
    cwd: !!js process.env.DSH_CWD ?? process.cwd()

- id: fs-policy
  name: '@huiliyi37/dsh-fs-policy'

- id: agent-spine
  name: '@huiliyi37/dsh-agent-spine-demo'
  config:
    includeHarnessIdentity: false
    persona: 'You are a helpful software engineer assistant.'
    workspaceContext: false
    skills:
      enabled: false
    toolBash: false
    toolTasks: false

- id: persistent-bash
  name: '@huiliyi37/dsh-tool-bash-persistent'

- id: str-replace-editor
  name: '@huiliyi37/dsh-tool-str-replace-editor'

- id: sessions
  name: '@huiliyi37/dsh-session-persistence-jsonl'
  config:
    root: !!js process.env.DSH_SESSION_ROOT ?? './.sessions'
    compression: none
