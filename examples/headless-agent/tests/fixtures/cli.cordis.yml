- id: cli-mock-llm
  name: './cli-mock-llm.ts'

- id: evidence-gate
  name: '@deepseek-ai/dsh-evidence-gate'

- id: agent-router
  name: '@deepseek-ai/dsh-agent-router'
  config:
    provider: cli-mock
    model: cli-mock

- id: str-replace-editor
  name: '@deepseek-ai/dsh-tool-str-replace-editor'

- id: repository-plugin-fixture
  name: './repository-plugin/load.mjs'

- id: base
  name: '@cordisjs/plugin-include'
  config:
    path: ../../cordis.yml
    patches:
      - id: llm-deepseek
        name: '@deepseek-ai/dsh-llm-deepseek'
        disabled: true
      - id: agent-spine
        name: '@deepseek-ai/dsh-agent-spine-demo'
        config:
          agents:
            - id: main
              provider: cli-mock
              model: cli-mock
              cwd: !!js process.cwd()
          workspaceContext: false
          dshHome: './.dsh-home'
          skills:
            local:
              agentsHome: './.agents-home'
          persona: 'Keyless headless-agent smoke.'
      - id: persistence
        name: '@deepseek-ai/dsh-session-persistence-jsonl'
        config:
          root: './.sessions'
