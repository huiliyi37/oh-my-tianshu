- id: cli-mock-llm
  name: './cli-mock-llm.ts'

- id: evidence-gate
  name: '@huiliyi37/dsh-evidence-gate'

- id: agent-router
  name: '@huiliyi37/dsh-agent-router'
  config:
    provider: cli-mock
    model: cli-mock
    # 精简装配未装 grep/glob/repo_graph/semantic_search——声明本装配可用子集，
    # 否则派发时 restrict 按 fail-loud 中止。
    profileTools:
      codeScout: ['read', 'bash']
      verifier: ['read', 'bash']

- id: str-replace-editor
  name: '@huiliyi37/dsh-tool-str-replace-editor'

- id: base
  name: '@huiliyi37/cordis-plugin-include'
  config:
    path: ../../cordis.yml
    patches:
      - id: llm-deepseek
        name: '@huiliyi37/dsh-llm-deepseek'
        disabled: true
      - id: agent-spine
        name: '@huiliyi37/dsh-agent-spine-demo'
        config:
          agents:
            - id: main
              provider: cli-mock
              model: cli-mock
              cwd: !!js process.cwd()
          workspaceContext: false
          dshHome: './.dsh-home'
          skills:
            local:
              agentsHome: './.agents-home'
          persona: 'Keyless headless-agent smoke.'
      - id: persistence
        name: '@huiliyi37/dsh-session-persistence-jsonl'
        config:
          root: './.sessions'
