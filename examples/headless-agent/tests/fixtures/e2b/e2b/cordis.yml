# One-world invariant (same pairing as examples/headless-agent/e2b.cordis.yml):
# e2b.cwd and sandbox-policy.workspaceRoot must name the same remote directory,
# which is also bash-local's implicit default workdir.
- id: e2b
  name: '@deepseek-ai/dsh-e2b'
  config:
    cwd: !!js process.cwd()
    timeoutMs: 180000

- id: subprocess-e2b
  name: '@deepseek-ai/dsh-subprocess-e2b'

- id: bash
  name: '@deepseek-ai/dsh-bash-local'
  config:
    timeoutMs: 30000

- id: fs-e2b
  name: '@deepseek-ai/dsh-fs-e2b'

- id: agents
  name: '@deepseek-ai/dsh-agent'

- id: sandbox-policy
  name: '@deepseek-ai/dsh-sandbox-policy'
  config:
    mode: danger-full-access
    workspaceRoot: !!js process.cwd()

- id: pty
  name: '@deepseek-ai/dsh-pty'

- id: pty-local
  name: '@deepseek-ai/dsh-pty-local'
  config:
    pollIntervalMs: 25
    exactProbeAfterMs: 150
    idleSilenceMs: 2000
    handoffGraceMs: 500
    timeoutMs: 5000
    disposeGraceMs: 1000

- id: lsp
  name: '@deepseek-ai/dsh-lsp'

- id: lsp-local
  name: '@deepseek-ai/dsh-lsp-local'
  config:
    servers:
      fixture:
        command: node
        args:
          - !!js process.cwd() + '/fixture-lsp.mjs'
        extensionToLanguage:
          .ts: typescript
        shutdownTimeoutMs: 1000
        killGraceMs: 500
