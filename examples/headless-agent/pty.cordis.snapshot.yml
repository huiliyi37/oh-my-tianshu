# Keyless opt-in PTY composition for the headless stream-json snapshot.
- id: base
  name: '@huiliyi37/cordis-plugin-include'
  config:
    path: ./cordis.yml
    patches:
      - id: llm-deepseek
        name: '@huiliyi37/dsh-llm-deepseek'
        disabled: true
      - insert:
          - id: sandbox-policy
            name: '@huiliyi37/dsh-sandbox-policy'
            config:
              mode: danger-full-access
          - id: pty
            name: '@huiliyi37/dsh-pty'
          - id: pty-snapshot-backend
            name: '../acp-agent/pty-snapshot-backend.mjs'
          - id: tool-pty
            name: '@huiliyi37/dsh-tool-pty'
            config:
              maxResultBytes: 64
          - id: llm-replay
            name: '@huiliyi37/dsh-llm-replay'
