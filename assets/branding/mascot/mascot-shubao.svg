<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320">
  <!-- 枢宝 Shubao · 完整形态（云纸卡片呈现版）
       大熊座小熊崽：天枢蓝身体、墨线手绘双描轮廓、奶白肚皮上的北斗七星
       （第一颗天枢为蓝色四角星辉）、腮红、头顶呆毛、手持 &gt;_ 提示符小旗。 -->
  <g stroke-linejoin="round" stroke-linecap="round">
    <rect x="4" y="4" width="312" height="312" rx="24" fill="#f7f4ec" stroke="#232734" stroke-width="3.5"/>
    <!-- 地面投影 -->
    <ellipse cx="160" cy="300" rx="100" ry="8" fill="#232734" opacity="0.08"/>
    <!-- 小旗：杆 + 琥珀旗面 + 提示符 -->
    <line x1="252" y1="78" x2="252" y2="300" stroke="#232734" stroke-width="5"/>
    <path d="M 252 70 L 308 92 L 252 114 Z" fill="#ffc94d" stroke="#232734" stroke-width="4"/>
    <text x="257" y="98" font-family="'JetBrains Mono', 'SF Mono', Menlo, monospace" font-size="16" font-weight="bold" fill="#232734">&gt;_</text>
    <!-- 耳朵（先画，被头遮住下半） -->
    <circle cx="84" cy="64" r="27" fill="#4d6bfe" stroke="#232734" stroke-width="5"/>
    <circle cx="236" cy="64" r="27" fill="#4d6bfe" stroke="#232734" stroke-width="5"/>
    <path d="M 70 52 Q 84 40 98 52" fill="none" stroke="#232734" stroke-width="3.5" opacity="0.6"/>
    <path d="M 222 52 Q 236 40 250 52" fill="none" stroke="#232734" stroke-width="3.5" opacity="0.6"/>
    <!-- 身体：坐姿梨形 -->
    <path d="M 82 190 C 62 244 76 282 102 290 C 118 295 202 295 218 290 C 244 282 258 244 238 190 C 230 166 200 152 160 152 C 120 152 90 166 82 190 Z"
          fill="#4d6bfe" stroke="#232734" stroke-width="5.5"/>
    <path d="M 84 192 C 64 246 78 284 104 292 C 120 297 204 297 220 292 C 246 284 260 246 240 192 C 232 168 202 154 162 154 C 122 154 92 168 84 192 Z"
          fill="none" stroke="#232734" stroke-width="3.5" opacity="0.13"/>
    <!-- 肚皮 + 北斗七星（天枢 = 蓝色四角星辉） -->
    <ellipse cx="160" cy="246" rx="46" ry="50" fill="#f2f5fa" stroke="#232734" stroke-width="4.5"/>
    <path d="M 160 205 L 163 212 L 170 215 L 163 218 L 160 225 L 157 218 L 150 215 L 157 212 Z"
          fill="#4d6bfe" stroke="#232734" stroke-width="3"/>
    <circle cx="149" cy="228" r="3.2" fill="#232734"/>
    <circle cx="155" cy="242" r="3.2" fill="#232734"/>
    <circle cx="168" cy="246" r="3.2" fill="#232734"/>
    <circle cx="174" cy="236" r="3.2" fill="#232734"/>
    <circle cx="183" cy="224" r="3.2" fill="#232734"/>
    <circle cx="189" cy="215" r="3.2" fill="#232734"/>
    <!-- 手：左臂自然垂、右臂举旗 -->
    <ellipse cx="74" cy="246" rx="16" ry="26" transform="rotate(-14 74 246)" fill="#4d6bfe" stroke="#232734" stroke-width="5"/>
    <ellipse cx="244" cy="240" rx="15" ry="24" transform="rotate(16 244 240)" fill="#4d6bfe" stroke="#232734" stroke-width="5"/>
    <!-- 脚 -->
    <ellipse cx="110" cy="290" rx="30" ry="12" fill="#4d6bfe" stroke="#232734" stroke-width="5"/>
    <ellipse cx="210" cy="290" rx="30" ry="12" fill="#4d6bfe" stroke="#232734" stroke-width="5"/>
    <path d="M 92 291 Q 100 285 108 291" fill="none" stroke="#232734" stroke-width="3"/>
    <path d="M 212 291 Q 220 285 228 291" fill="none" stroke="#232734" stroke-width="3"/>
    <!-- 头（最后画，压在身体上） -->
    <path d="M 160 56 C 206 54 250 78 252 126 C 254 176 214 210 160 212 C 106 210 66 176 68 126 C 70 78 114 54 160 56 Z"
          fill="#4d6bfe" stroke="#232734" stroke-width="5.5"/>
    <path d="M 158 58 C 204 56 248 80 250 128 C 252 178 212 212 158 214 C 104 212 64 178 66 128 C 68 80 112 56 158 58 Z"
          fill="none" stroke="#232734" stroke-width="3.5" opacity="0.13"/>
    <!-- 呆毛 -->
    <path d="M 155 57 Q 152 46 162 42 Q 158 52 166 56" fill="none" stroke="#232734" stroke-width="4.5"/>
    <!-- 口鼻 -->
    <ellipse cx="160" cy="166" rx="35" ry="25" fill="#f2f5fa" stroke="#232734" stroke-width="4.5"/>
    <path d="M 151 155 Q 160 148 169 155 Q 160 162 151 155 Z" fill="#232734"/>
    <line x1="160" y1="162" x2="160" y2="172" stroke="#232734" stroke-width="4"/>
    <path d="M 147 176 Q 160 187 173 176" fill="none" stroke="#232734" stroke-width="5"/>
    <!-- 眼 + 高光 -->
    <circle cx="117" cy="116" r="8" fill="#14204a"/>
    <circle cx="203" cy="116" r="8" fill="#14204a"/>
    <circle cx="120" cy="113" r="2.8" fill="#ffffff"/>
    <circle cx="206" cy="113" r="2.8" fill="#ffffff"/>
    <!-- 腮红 -->
    <ellipse cx="99" cy="142" rx="11" ry="7.5" fill="#f5a8b8" opacity="0.55"/>
    <ellipse cx="221" cy="142" rx="11" ry="7.5" fill="#f5a8b8" opacity="0.55"/>
  </g>
</svg>
